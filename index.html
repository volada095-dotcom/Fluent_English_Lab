<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>30-Day Language Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>30-Day Language Challenge</h1>
  <p>Master Advanced Phrasal Verbs</p>
</header>

<!-- КАРТОЧКИ КУРСОВ -->
<section class="courses" id="courses"></section>

<!-- СТРАНИЦА УРОКА -->
<section class="lesson-page" id="lesson-page" style="display:none;">

  <!-- ЛЕВЫЙ СПИСОК ДНЕЙ -->

<script src="courses/advanced-phrasal-verbs.js"></script>
